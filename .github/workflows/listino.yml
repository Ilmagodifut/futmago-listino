# IL LAVORO CHE RIGENERA IL LISTINO
#
# Va in `Ilmagodifut/futmago-listino`, come `.github/workflows/listino.yml`.
# La copia buona, quella che si modifica, e' questa.
#
# ── PERCHE' QUI E NON SUL SITO ────────────────────────────────────────────
#
# Perche' fut.gg non risponde piu' ne' a Netlify ne' a Cloudflare (misurato il
# 20/09/2026: 502 e 403), e perche' ogni pubblicazione sul sito costa 15
# crediti Netlify. Qui non costa niente e non tocca il sito.
#
# ── PERCHE' UN RAMO RIFATTO OGNI VOLTA ────────────────────────────────────
#
# Il listino pesa 128 KB per piattaforma e cambia a ogni giro. Tenendone la
# storia vorrebbe dire far crescere il repository di qualche decina di MB al
# giorno, per sempre, senza che quella storia serva a nessuno. Il ramo `dati`
# viene quindi RIFATTO a ogni esecuzione: un commit solo, sempre lo stesso peso.

name: listino

# ── PERCHE' UN GIRO LUNGO E NON UN GIRO OGNI QUARTO D'ORA ──────────────────
#
# MISURATO il 16/10/2026: il cron «ogni 15 minuti» GitHub lo esegue quando
# puo', cioe' ogni 3-6 ore (oggi 04:32, 09:32, 14:44, 18:58). Le carte uscite
# alle 19:00 non avevano un prezzo, e FUTMAGO le dava per «estinte».
#
# Ora ogni esecuzione resta accesa quasi sei ore (il massimo di GitHub) e
# rigenera il listino ogni quarto d'ora da sola. Quando GitHub fa partire
# l'esecuzione successiva, quella vecchia si chiude (`cancel-in-progress`) e
# la nuova prosegue: il listino resta fresco senza buchi. Il repository e'
# pubblico, quindi i minuti non costano niente.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Serve solo a spingere sul ramo `dati` di questo stesso repository.
permissions:
  contents: write

concurrency:
  group: listino
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Listino ogni quarto d'ora, per quasi sei ore
        run: |
          inizio=$(date +%s)
          giro=0
          # 22 giri da 15 minuti = 5 ore e mezza, sotto il limite di 6.
          while [ $giro -lt 22 ]; do
            giro=$((giro + 1))
            partenza=$(date +%s)
            echo "── giro $giro ($(date -u +%H:%M:%SZ))"
            rm -rf listino
            if node costruisci-listino.mjs listino; then
              (
                set -e
                cd listino
                git init -q
                git config user.name  "listino"
                git config user.email "listino@ilmagodifut.com"
                git add -A
                git commit -q -m "listino $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git push -q --force                   "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"                   HEAD:dati
              ) && cat listino/stato.json || echo "pubblicazione fallita, riprovo al prossimo giro"
            else
              echo "fut.gg non ha risposto, riprovo al prossimo giro"
            fi
            # Un giro in piu' solo se resta tempo per farlo intero.
            [ $(( $(date +%s) - inizio )) -gt $((5 * 3600 + 20 * 60)) ] && break
            attesa=$(( 900 - ( $(date +%s) - partenza ) ))
            [ $attesa -gt 0 ] && sleep $attesa
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
